<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cécile Hugon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@1,300;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Merriweather Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #fcfbf4;
      color: #10181e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(48px, 12vw, 116px);
      max-width: 804px;
      width: 100%;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 44px;
      width: 100%;
    }

    .ladder {
      width: clamp(52px, 8vw, 70px);
      height: auto;
      display: block;
    }

    .identity {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
    }

    .name-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    h1 {
      font-family: 'Merriweather Sans', sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: clamp(22px, 3.6vw, 28px);
      line-height: 1.2;
      color: #10181e;
      text-align: center;
    }

    .star {
      width: 15.36px;
      height: 15.712px;
      display: block;
    }

    .tagline {
      font-family: 'Merriweather Sans', sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(17px, 2.8vw, 28px);
      line-height: 1.2;
      color: #10181e;
      text-align: center;
    }

    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      font-family: 'Merriweather Sans', sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(15px, 2vw, 20px);
      line-height: 1.2;
      color: #10181e;
      text-align: center;
    }

    .contact a {
      color: inherit;
      text-decoration: none;
    }

    .contact a.link {
      text-decoration: underline;
      text-decoration-skip-ink: none;
      text-underline-position: from-font;
    }

    .contact a:hover {
      opacity: 0.7;
    }

    .footer {
      font-family: 'Merriweather Sans', sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(13px, 1.6vw, 16px);
      line-height: 1.5;
      color: #6a6f72;
      text-align: center;
      max-width: 590px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <img class="ladder" src="assets/ladder.svg" alt="">
      <div class="identity">
        <div class="name-block">
          <h1>Cécile Hugon</h1>
          <img class="star" src="assets/star.svg" alt="">
          <p class="tagline">Product designer &amp;&nbsp; Product Builder</p>
        </div>
        <div class="contact">
          <p>Me contacter sur <a class="link" href="https://www.linkedin.com/in/cécile-hugon" target="_blank" rel="noopener">linkedin</a></p>
          <p><a href="tel:+33643549647">+ 33 6 43 54 96 47</a></p>
        </div>
      </div>
    </div>
    <p class="footer">BESOIN D'UNE FORMATION ? Je partage aussi mon expertise en tant que formatrice en conception d'interface centrée expérience utilisateur.</p>
  </div>
</body>
</html>
