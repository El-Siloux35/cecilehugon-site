<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cécile Hugon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #666;
      font-weight: 300;
    }

    a {
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cécile Hugon</h1>
    <p>Site en cours de refonte — bientôt de retour.</p>
  </div>
</body>
</html>
