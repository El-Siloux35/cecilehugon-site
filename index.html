<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cécile Hugon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@1,300;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      overflow-x: hidden;
    }

    body {
      position: relative;
      font-family: 'Merriweather Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #fcfbf4;
      color: #10181e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    .shapes {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .shape {
      position: absolute;
      display: block;
      height: auto;
      will-change: transform;
    }

    /* arrière-plan : la moins nette, la plus estompée, bouge le moins */
    .shape-3 {
      width: clamp(130px, 18.03vw, 346px);
      left: 61.46%;
      top: -7.41%;
      z-index: 1;
      opacity: 0.42;
      filter: blur(1px);
    }

    /* plan intermédiaire */
    .shape-1 {
      width: clamp(64px, 9.05vw, 174px);
      left: 13.6%;
      top: 21.2%;
      z-index: 2;
      opacity: 0.85;
    }

    /* premier plan : nette, contrastée, portée par une ombre, bouge le plus */
    .shape-2 {
      width: clamp(88px, 12.47vw, 239px);
      left: 79.84%;
      top: 56.67%;
      z-index: 3;
      filter: drop-shadow(0 12px 20px rgba(16, 24, 30, 0.18));
    }

    .shape-4 {
      width: clamp(104px, 14.81vw, 284px);
      left: 7.86%;
      top: 83.52%;
      z-index: 3;
      filter: drop-shadow(0 14px 24px rgba(16, 24, 30, 0.2));
    }

    .shape.is-grabbed {
      filter: drop-shadow(0 18px 28px rgba(16, 24, 30, 0.28));
    }

    .hand-toggle {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(16, 24, 30, 0.15);
      background: rgba(252, 251, 244, 0.9);
      backdrop-filter: blur(6px);
      font-family: 'Merriweather Sans', sans-serif;
      font-style: italic;
      font-weight: 300;
      font-size: 14px;
      color: #10181e;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(16, 24, 30, 0.08);
    }

    .hand-toggle:hover {
      background: rgba(252, 251, 244, 1);
    }

    .hand-video {
      display: none;
    }

    .hand-preview {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 5;
      width: 176px;
      height: 132px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(16, 24, 30, 0.15);
      box-shadow: 0 10px 24px rgba(16, 24, 30, 0.18);
      background: #10181e;
      display: none;
    }

    .hand-preview.is-active {
      display: block;
    }

    .hand-preview canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hand-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 22px;
      height: 22px;
      margin: -11px 0 0 -11px;
      border-radius: 50%;
      background: rgba(16, 24, 30, 0.35);
      border: 2px solid rgba(16, 24, 30, 0.5);
      pointer-events: none;
      z-index: 4;
      display: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .hand-cursor.is-visible {
      display: block;
    }

    .hand-cursor.is-pinching {
      background: rgba(255, 61, 0, 0.55);
      border-color: #ff3d00;
      transform: scale(1.3);
    }

    @media (max-width: 640px) {
      .shapes,
      .hand-toggle,
      .hand-preview,
      .hand-cursor {
        display: none;
      }
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(48px, 12vw, 116px);
      max-width: 804px;
      width: 100%;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 44px;
      width: 100%;
    }

    .ladder {
      width: clamp(52px, 8vw, 70px);
      height: auto;
      display: block;
    }

    .identity {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
    }

    .name-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    h1 {
      font-family: 'Merriweather Sans', sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: clamp(22px, 3.6vw, 28px);
      line-height: 1.2;
      color: #10181e;
      text-align: center;
    }

    .star {
      width: 15.36px;
      height: 15.712px;
      display: block;
    }

    .tagline {
      font-family: 'Merriweather Sans', sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(17px, 2.8vw, 28px);
      line-height: 1.2;
      color: #10181e;
      text-align: center;
    }

    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      font-family: 'Merriweather Sans', sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(15px, 2vw, 20px);
      line-height: 1.2;
      color: #10181e;
      text-align: center;
    }

    .contact a {
      color: inherit;
      text-decoration: none;
    }

    .contact a.link {
      text-decoration: underline;
      text-decoration-skip-ink: none;
      text-underline-position: from-font;
    }

    .contact a:hover {
      opacity: 0.7;
    }

    .footer {
      font-family: 'Merriweather Sans', sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(13px, 1.6vw, 16px);
      line-height: 1.5;
      letter-spacing: 0.16px;
      color: #6a6f72;
      text-align: center;
      max-width: 590px;
      margin: 0 auto;
    }
  </style>
</head>

  <script>
    (function () {
      var shapes = Array.prototype.slice.call(document.querySelectorAll('.shape'));
      if (!shapes.length) return;

      var toggle = document.getElementById('handToggle');
      var preview = document.getElementById('handPreview');
      var video = document.getElementById('handVideo');
      var canvas = document.getElementById('handCanvas');
      var ctx = canvas.getContext('2d');
      var cursor = document.getElementById('handCursor');

      var shapeState = new Map();
      shapes.forEach(function (el) {
        shapeState.set(el, { x: 0, y: 0 });
      });

      var hands = null;
      var stream = null;
      var rafId = null;
      var active = false;
      var scriptsLoaded = false;

      var grabbedShape = null;
      var grabStart = null;
      var pinching = false;

      function applyTransform(el) {
        var state = shapeState.get(el);
        var scale = parseFloat(el.dataset.scale) || 1;
        el.style.transform = 'translate(' + state.x.toFixed(1) + 'px, ' + state.y.toFixed(1) + 'px) scale(' + scale + ')';
      }

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.crossOrigin = 'anonymous';
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      function releaseGrab() {
        if (grabbedShape) {
          grabbedShape.classList.remove('is-grabbed');
        }
        grabbedShape = null;
        grabStart = null;
      }

      function onResults(results) {
        canvas.width = canvas.width; // clear
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
        ctx.restore();

        var landmarks = results.multiHandLandmarks && results.multiHandLandmarks[0];
        if (!landmarks) {
          cursor.classList.remove('is-visible');
          pinching = false;
          releaseGrab();
          return;
        }

        var indexTip = landmarks[8];
        var thumbTip = landmarks[4];
        var vw = video.videoWidth || 640;
        var vh = video.videoHeight || 480;

        var dx = (thumbTip.x - indexTip.x) * vw;
        var dy = (thumbTip.y - indexTip.y) * vh;
        var pinchDist = Math.hypot(dx, dy);

        if (!pinching && pinchDist < 42) pinching = true;
        else if (pinching && pinchDist > 58) pinching = false;

        var pageX = (1 - indexTip.x) * window.innerWidth;
        var pageY = indexTip.y * window.innerHeight;

        cursor.classList.add('is-visible');
        cursor.classList.toggle('is-pinching', pinching);
        cursor.style.transform = 'translate(' + pageX.toFixed(1) + 'px, ' + pageY.toFixed(1) + 'px)';

        if (pinching) {
          if (!grabbedShape) {
            var nearest = null;
            var minDist = Infinity;
            shapes.forEach(function (el) {
              var rect = el.getBoundingClientRect();
              var cx = rect.left + rect.width / 2;
              var cy = rect.top + rect.height / 2;
              var d = Math.hypot(cx - pageX, cy - pageY);
              var pickRadius = Math.max(rect.width, rect.height) / 2 + 40;
              if (d < pickRadius && d < minDist) {
                minDist = d;
                nearest = el;
              }
            });
            if (nearest) {
              grabbedShape = nearest;
              grabbedShape.classList.add('is-grabbed');
              var state = shapeState.get(nearest);
              grabStart = { fx: pageX, fy: pageY, sx: state.x, sy: state.y };
            }
          } else {
            var st = shapeState.get(grabbedShape);
            st.x = grabStart.sx + (pageX - grabStart.fx);
            st.y = grabStart.sy + (pageY - grabStart.fy);
            applyTransform(grabbedShape);
          }
        } else {
          releaseGrab();
        }
      }

      function setButtonState(isActive, label) {
        toggle.textContent = label || (isActive ? '🖐️ Désactiver la caméra' : '🖐️ Bouger les formes à la main');
      }

      async function frameLoop() {
        if (!active) return;
        await hands.send({ image: video });
        rafId = requestAnimationFrame(frameLoop);
      }

      async function start() {
        setButtonState(false, '🖐️ Activation…');
        try {
          if (!scriptsLoaded) {
            await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js');
            scriptsLoaded = true;
          }

          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: 480, height: 360 },
            audio: false
          });
          video.srcObject = stream;
          await video.play();

          hands = new window.Hands({
            locateFile: function (file) {
              return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + file;
            }
          });
          hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.5
          });
          hands.onResults(onResults);

          active = true;
          preview.classList.add('is-active');
          setButtonState(true);
          frameLoop();
        } catch (err) {
          console.error('Suivi de la main indisponible :', err);
          if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
          setButtonState(false, '🖐️ Caméra refusée');
          setTimeout(function () { setButtonState(false); }, 2500);
        }
      }

      function stop() {
        active = false;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        releaseGrab();
        pinching = false;
        cursor.classList.remove('is-visible', 'is-pinching');
        preview.classList.remove('is-active');
        if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
        video.srcObject = null;
        if (hands) { hands.close(); hands = null; }
        setButtonState(false);
      }

      toggle.addEventListener('click', function () {
        if (active) stop(); else start();
      });
    })();
  </script>
</body>
</html>
